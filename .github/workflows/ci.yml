name: Tests

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_powershell:
    name: WindowsPowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: my_bucket
      - name: Checkout Scoop
        uses: actions/checkout@v7
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/Documents/WindowsPowerShell/Modules
          key: powershell-modules-${{ hashFiles('bin/test.ps1') }}
          restore-keys: |
            powershell-modules-
      - name: Install test dependencies
        shell: powershell
        run: |
          Install-Module -Name BuildHelpers -Force -SkipPublisherCheck
          Install-Module -Name Pester -MaximumVersion 5.99.99 -Force -SkipPublisherCheck
      - name: Test Bucket
        shell: powershell
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
  test_pwsh:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: my_bucket
      - name: Checkout Scoop
        uses: actions/checkout@v7
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/Documents/PowerShell/Modules
          key: pwsh-modules-${{ hashFiles('bin/test.ps1') }}
          restore-keys: |
            pwsh-modules-
      - name: Install test dependencies
        shell: pwsh
        run: |
          Install-Module -Name BuildHelpers -Force -SkipPublisherCheck
          Install-Module -Name Pester -MaximumVersion 5.99.99 -Force -SkipPublisherCheck
      - name: Test Bucket
        shell: pwsh
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint commit messages
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          FROM="$BEFORE"
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            FROM="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Linting $FROM..$GITHUB_SHA"
          bunx commitlint --from "$FROM" --to "$GITHUB_SHA" --verbose
